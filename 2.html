<!DOCTYPE html>
<html>
<head>
    <title>Ejercicio 2</title>
</head>
<body>

<script>
let nota = parseFloat(prompt("Ingrese una nota"));

if (nota >= 0 && nota < 3) {
    alert("Muy deficiente");
} else if (nota < 5) {
    alert("Insuficiente");
} else if (nota < 6) {
    alert("Suficiente");
} else if (nota < 7) {
    alert("Bien");
} else if (nota < 9) {
    alert("Notable");
} else if (nota <= 10) {
    alert("Sobresaliente");
} else {
    alert("Nota no válida");
}
</script>

</body>
</html>
